[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyresponse"
version = "0.4.0"
description = "A simple web framework in Python that respects OOP."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mario Schillermann" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "python-multipart>=0.0.9",
]

[project.scripts]
pyresponse = "pyresponse.cli.__main__:main"
pyr = "pyresponse.cli.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.28.0",
    "pyright>=1.1.350",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyresponse*", "pyr*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportAbstractUsage = false
